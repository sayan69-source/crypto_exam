# ZUUP-OS USBGuard rules — DEV / ALL-IN-ONE IMAGES ONLY.
#
# The production ruleset (rules.conf) pins each allowed device to the physical
# port it was commissioned on, for one procurement batch: `allow via-port "1-1"`
# for the seat keyboard, "1-2" for the mouse, and so on. That is the right policy
# for a terminal somebody physically commissioned, and it is the wrong policy for
# every other machine, because `ImplicitPolicyTarget=block` means anything those
# rules do not match gets no driver at all.
#
# On a demo laptop nobody commissioned, none of those port paths correspond to
# anything, so the effect of shipping the production rules is: every USB device
# on the machine is unauthorised. Including the keyboard an operator plugs in
# when the built-in one is not working — which removes the one diagnostic step
# left on a machine with no shell and no working keys.
#
# Note the production rules also allow no hub class (09:xx:xx). Where a port
# lives behind an internal hub, the hub is blocked and nothing downstream ever
# enumerates, so the seat keyboard would not appear either. That is worth
# revisiting before the rules are trusted on real procured hardware.
#
# What this variant keeps: the classes that actually carry the attacks the
# threat model names — mass storage (exfiltration of a paper), network adapters
# (a route around the air gap), and every exotic class the kernel config already
# compiles out — remain unauthorised by the implicit block target. What it
# relaxes: human-interface and capture devices are allowed on ANY port, because
# on a machine that was never commissioned there is no correct port to name.

# Human interface — the WHOLE class, not an enumeration of subclass/protocol
# triples. A keyboard that declares no boot protocol (03:00:00), or an odd
# subclass, is still a keyboard, and the entire point of this file is that the
# machine's real hardware is unknown. Class 03 cannot be a storage or network
# device, so widening it costs nothing the threat model cares about.
allow with-interface one-of { 03:*:* }

# UVC webcam (face capture, §8).
allow with-interface one-of { 0e:*:* }

# The CDC-ACM fingerprint reader — narrow ON PURPOSE. Class 02 also contains
# 02:06:xx, USB Ethernet: allowing the class wholesale would authorise a network
# adapter, which is a route around the air gap.
allow with-interface one-of { 02:02:01 0a:00:00 }

# Hubs. A laptop's built-in ports are routinely behind internal hubs, and a
# blocked hub silently blocks everything plugged into it.
allow with-interface one-of { 09:*:* }

# Everything else: implicit block (usbguard-daemon.conf). Mass storage (08:*),
# network (02:06:*, ff:*), audio, printers and the rest stay unauthorised.
