#!/usr/sbin/nft -f
# ZUUP-OS terminal firewall (spec §6.3) — default-drop, one peer, nothing else.
#
# This is enforcement layer #4 of the four independent internet-isolation layers
# (§6.2). Even if routing/DNS were misconfigured, this table makes a non-tunnel
# packet impossible. Loaded by a systemd unit before the network comes up.
#
# Acceptance (INV-3): from a candidate seat or an invigilator station,
# curl/ping/DNS to any public address fail; `ip route` shows only the WireGuard
# route + loopback.
#
# ── Why the rules below are not written in terms of interfaces ───────────────
#
# The previous ruleset admitted `iifname "wg0" ct state established,related` on
# input and nothing else, and permitted egress with `udp dport 51820 oifname
# "eth0"`. Both are wrong in a way that only shows up on a real terminal, which
# is why the all-in-one never hit it — that image runs the whole centre on
# loopback and never raises a tunnel.
#
#   * WireGuard's TRANSPORT does not travel on wg0. wg0 is where the DECRYPTED
#     packets appear; the UDP that carries them arrives on the physical link.
#     So the handshake reply from the Edge landed on the LAN interface, matched
#     no accept rule, and was dropped — wg0 could never complete a handshake, a
#     production terminal could never reach its Edge, `zuup-attest.sh` would
#     find the Edge unreachable and halt the machine. The firewall bricked the
#     boot it exists to protect.
#
#   * `oifname "eth0"` names an interface this image does not have. The kernel
#     cmdline does not set `net.ifnames=0`, so udev applies predictable names
#     (`enp2s0`, `eno1`, …) and the egress rule matched nothing either.
#
# Interfaces are therefore used only for `lo` and `wg0`, which are named by us.
# Everything about the LAN link is expressed as conntrack state plus a pinned
# peer ADDRESS, which is true regardless of what the NIC ends up being called.

flush ruleset

table inet zuup {
  # The Edge's LAN address — the only host in the world this terminal may
  # exchange WireGuard packets with.
  #
  # EMPTY in a freshly built image, on purpose. An unprovisioned terminal has no
  # centre, and must not be able to send a handshake to one it was never given;
  # an empty set means every rule below that references it matches nothing and
  # the default drop stands. Provisioning adds exactly one element via
  # /etc/zuup/nftables.d/10-edge-peer.nft (see tools/provision-terminal.sh).
  set edge_lan {
    type ipv4_addr
  }

  # ── HQ egress — the ADMIN_STATION's destinations, and nobody else's ───────
  #
  # The Centre Admin is the centre's single point of contact with the outside
  # world: it pulls the provisioning bundle before exam day and forwards sealed
  # envelopes it cannot open afterwards. Every other surface — candidate seats,
  # invigilator stations — has no internet by any route, at any time.
  #
  # Two independent things have to be true before a packet leaves for HQ, and it
  # is worth being precise about which mechanism supplies which:
  #
  #   WHERE it may go   `hq_dest`, below. Filled by zuup-identity.service at
  #                     boot, from `zuup.hq=` on the kernel cmdline, and ONLY
  #                     when `zuup.capability=ADMIN_STATION` is also on that
  #                     cmdline. The cmdline is inside the Unified Kernel Image,
  #                     which is sbsigned — so changing a terminal's capability,
  #                     or giving a candidate seat an HQ destination, requires
  #                     the exam authority's Secure Boot signing key. Editing the
  #                     USB stick does not do it: the firmware refuses to boot an
  #                     unsigned UKI.
  #
  #   WHEN it may go    the `hq_window` chain, below. Empty at every boot.
  #
  # Honest about both limits, because they are different:
  #
  #   * The WINDOW is runtime state. A fully compromised ADMIN_STATION running
  #     as root could open its own early.
  #   * The DESTINATION is authenticated by Secure Boot, not by being read-only.
  #     Root on a running terminal could also write into
  #     /run/zuup-identity/nftables.d — but root on a verity-rooted, shell-less,
  #     seccomp-confined kiosk means every other layer has already failed, and
  #     such a machine could simply ignore nftables altogether. The boundary
  #     worth stating is the one against an attacker with the hardware and the
  #     image but not the signing key, and that boundary holds.
  #
  # So: the worst case for a rooted admin station is that it can talk to HQ, and
  # to nothing else. The worst case for a rooted candidate seat is the same as
  # for any rooted machine, and is not what this set is defending against.
  set hq_dest {
    type ipv4_addr . inet_service
  }

  chain input {
    type filter hook input priority 0; policy drop;
    iifname "lo" accept

    # DHCP client. The Edge is the only DHCP server on the exam VLAN (see
    # network/pxe/dnsmasq.conf) and the lease is how this machine gets a LAN
    # address at all. An OFFER arrives before the terminal has an address, so
    # this is the one rule that cannot also be narrowed by source address.
    udp sport 67 udp dport 68 accept

    # WireGuard transport, inbound. `ct state established` means this admits
    # only a reply to a packet this terminal already sent, so the peer is pinned
    # by conntrack as well as by @edge_lan. `related` lets ICMP errors for that
    # flow through, which is what keeps path-MTU discovery working across a hall.
    udp sport 51820 ip saddr @edge_lan ct state established,related accept

    # Decrypted traffic that came out of the tunnel.
    iifname "wg0" ct state established,related accept

    # Return traffic for an HQ connection this machine opened. Pinned to the
    # same endpoints as egress, so this cannot become a general inbound path.
    ip saddr . tcp sport @hq_dest ct state established accept

    # everything else: dropped, logged to the volatile tmpfs ring buffer
    log prefix "ZUUP-DROP-IN " drop
  }

  chain output {
    type filter hook output priority 0; policy drop;
    oifname "lo" accept
    oifname "wg0" accept                   # tunnelled traffic to the Edge only

    udp sport 68 udp dport 67 accept       # DHCP DISCOVER/REQUEST

    # The WireGuard handshake, to the ONE address provisioning pinned. This used
    # to be `udp dport 51820 oifname "eth0"` — any host on the internet, had the
    # terminal had a route to one, which is a hole in the layer whose entire job
    # is that it does not.
    udp dport 51820 ip daddr @edge_lan accept

    # A packet for a pinned HQ endpoint is offered to the window chain. If the
    # window is shut that chain is empty, the jump returns, and control falls
    # through to the log+drop below — so "closed" is the default and needs no
    # rule of its own.
    ip daddr . tcp dport @hq_dest jump hq_window

    log prefix "ZUUP-DROP-OUT " drop
  }

  # The egress WINDOW. Empty here, and empty on every boot.
  #
  # `zuup-egress.service` puts a single `accept` in this chain once the Edge has
  # authorised egress for the exam, and flushes it again when the window shuts.
  # The Edge refuses that authorisation until the exam window has closed AND
  # every present candidate has submitted (repo.egressStatus, POST
  # /api/admin/egress/open), which is what keeps the live paper off the internet
  # for the entire duration of the paper.
  #
  # Keeping the window as a CHAIN rather than a flag in a set is what makes the
  # closed state require no rule: an empty chain denies by falling through.
  chain hq_window {
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}

# Fleet-wide drop-ins, inside the signed read-only root.
include "/etc/zuup/nftables.d/*.nft"

# Per-terminal drop-ins, written at boot by zuup-identity.service from the
# parameters on the SIGNED kernel cmdline (see that unit). This is where
# `edge_lan` gets its one element, and where an ADMIN_STATION — and only an
# ADMIN_STATION — gets its `hq_dest` entries.
#
# Both globs may legitimately match nothing: an unprovisioned image has no
# identity, and the all-in-one has no /run/zuup-identity/nftables.d at all. nft
# loads cleanly in both cases (verified against an empty directory and a missing
# one), so the firewall never fails to load — which matters, because
# zuup-firewall.service carries FailureAction=poweroff-force.
include "/run/zuup-identity/nftables.d/*.nft"
