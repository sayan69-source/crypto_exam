# DEV/ALL-IN-ONE drop-in for zuup-kiosk.service. Installed only in the
# --allinone image variant. It points the kiosk at the LOCAL proxy instead of a
# remote Edge, and makes the kiosk wait for the local stack to be up.
[Unit]
After=zuup-proxy.service zuup-edge.service
# Wants=, not Requires=: order the kiosk after the proxy, but do not let a proxy
# that failed to start take the display with it. A kiosk that comes up and says
# "no centre reachable, variant allinone" on screen is triageable; a machine
# that never starts the compositor at all is a black screen and a guess.
Wants=zuup-proxy.service

[Service]
# edge.local resolves to 127.0.0.1 (see /etc/hosts) and Caddy serves it on :80.
Environment=ZUUP_EDGE_URL=http://edge.local
# DEMO ONLY — pin the kiosk to the operator role chooser instead of routing by
# this terminal's baked capability. One laptop is standing in for a whole
# centre here, so it has to be able to present the invigilator console, the
# Centre Admin portal and a candidate seat in turn. The chooser only selects
# which terminal identity the browser presents; the Edge still answers with
# that terminal's capability and every portal still runs its own match-all
# login, so nothing is granted by choosing. Unset on every production image,
# where the capability lookup in the launcher is the only router.
Environment=ZUUP_KIOSK_URL=http://edge.local/kiosk/
# The all-in-one cold-starts PostgreSQL (initdb + a 487-candidate restore), the
# Edge, two Next servers and Caddy from a read-only image into tmpfs. Caddy
# answers within a second or two, which is all the launcher waits for — this
# budget is the outer bound before it gives up and shows the diagnostic page.
Environment=ZUUP_KIOSK_READY_BUDGET=240
