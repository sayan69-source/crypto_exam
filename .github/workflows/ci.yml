# CI — every suite in the repo, plus the guards that catch what tests cannot.
#
# The jobs are split by runtime rather than by component so a failure names the
# thing that broke without needing the log opened: `backend` red means Python,
# `contracts` red means Solidity. They run in parallel and share nothing.
#
# `guards` is the cheapest job by an order of magnitude — no install step at
# all, since those scripts import only node: builtins — and it catches the
# failure mode this project actually has: code that compiles, builds, passes
# its tests, and is a lie. A dead button and a committed private key both
# survive every other job here.
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"

jobs:
  # ── The cheap, high-value checks ──────────────────────────────────────────
  guards:
    name: guards (no fakes, no secrets, boundary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-no-secrets reads `git ls-files`, which needs a real checkout,
          # not the default shallow one for the tree to be complete.
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No `npm ci` on purpose: all three scripts use only node: builtins, so
      # this job is green or red within seconds of the checkout finishing.
      - name: private/ must not import public/
        run: node scripts/check-boundary.mjs

      - name: no dead controls or fabricated values
        run: node scripts/check-no-fakes.mjs

      - name: no secrets tracked by git
        run: node scripts/check-no-secrets.mjs

  # ── Python API ────────────────────────────────────────────────────────────
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest

    # SQLite (what the rest of this suite runs against) does not enforce
    # foreign keys by default, so an INSERT-ordering bug in the seeder — a
    # child row flushed before the parent it references — is invisible there
    # no matter how many times the suite runs. It shipped exactly that way:
    # ExamOffering/BiometricEnrollment have a bare ForeignKey column but no
    # ORM relationship() back to their parent, so SQLAlchemy's automatic
    # insert ordering didn't reliably see the dependency. On Render's real
    # Postgres that's a ForeignKeyViolationError that aborts the WHOLE
    # seeding transaction — silently emptying the production database on
    # every restart while the log claimed "Seeding complete". This service
    # is what lets test_seeder_postgres_integration.py catch that for real.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ce
          POSTGRES_PASSWORD: ce
          POSTGRES_DB: cryptoexam_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ce -d cryptoexam_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: public/backend/requirements-dev.txt

      - name: Install (production deps + test runner)
        working-directory: public/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # No JWT keys are committed (they are gitignored, correctly), and none are
      # generated here. app/services/auth.py mints an ephemeral RS256 pair when
      # the PEM files are absent and derives the public half from the cached
      # private one, so tokens verify within the run and no key outlives it.
      - name: pytest
        working-directory: public/backend
        run: pytest -q

      # SEEDER_POSTGRES_URL set → the two tests in this file run for real
      # instead of skipping. If Postgres is ever unavailable they'd go quiet
      # rather than failing, so assert explicitly that neither was skipped.
      - name: pytest (seeder against real Postgres)
        working-directory: public/backend
        env:
          SEEDER_POSTGRES_URL: postgresql+asyncpg://ce:ce@127.0.0.1:5432/cryptoexam_ci
        run: |
          pytest -q tests/test_seeder_postgres_integration.py -v --no-header 2>&1 | tee /tmp/seeder_pg.log
          if grep -q "SKIPPED" /tmp/seeder_pg.log; then
            echo "::error::seeder Postgres integration test skipped — Postgres service unavailable"
            exit 1
          fi

      # The terminal's biometric daemon is Python too, and nothing ran it. That
      # is how `enrol()` came to return sha256(embedding) while `verify()`
      # compared 128 floats: every face check scored 0.0, for every candidate,
      # and fail-closed meant it looked like strictness rather than a break.
      # It needs only numpy — no camera, no OpenCV — because what is under test
      # is the representation contract between the two halves.
      - name: pytest (terminal biometric daemon)
        run: pytest -q private/zuup-os/biometric

  # ── Public web app ────────────────────────────────────────────────────────
  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: public/frontend/package-lock.json

      - name: Install
        working-directory: public/frontend
        run: npm ci

      - name: Typecheck
        working-directory: public/frontend
        run: npx tsc --noEmit

      # NEXT_PUBLIC_USE_MOCK is deliberately unset. USE_MOCK is opt-IN, so an
      # unset variable must produce a build that talks to the real API — if that
      # ever inverts again, this job builds the fixture-serving variant and the
      # mock-opt-in guard fails in the `guards` job.
      - name: Build
        working-directory: public/frontend
        run: npx next build

  # ── Node services: edge server + exam terminal ────────────────────────────
  node-services:
    name: node services (edge-server, exam-terminal)
    runs-on: ubuntu-latest

    # The integration suite is the only place the estate's invariants are
    # exercised end to end — attestation, the signed-capture login, seat
    # assignment under contention, the answer ledger, the egress gate. Without a
    # database those 19 tests SKIP, and a skipped test reports green: they had
    # drifted so far behind the code that 8 of them failed the first time they
    # were ever run. Giving CI a Postgres is what stops that happening twice.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zuup
          POSTGRES_PASSWORD: zuup
          POSTGRES_DB: zuup_edge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zuup -d zuup_edge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # edge-server is a root workspace, so the root lockfile installs it.
      - name: Install workspaces
        run: npm ci

      # DATABASE_URL is set, so the integration suite RUNS here rather than
      # skipping. If Postgres is ever unavailable the suite would go quiet
      # instead of failing, so the guard below asserts that nothing skipped.
      - name: edge-server tests (unit + integration)
        env:
          DATABASE_URL: postgres://zuup:zuup@127.0.0.1:5432/zuup_edge
        run: |
          set -o pipefail
          node --test --experimental-strip-types \
            "private/edge-server/src/**/*.test.ts" | tee /tmp/edge-tests.log
          skipped=$(grep -E '^ℹ skipped' /tmp/edge-tests.log | grep -oE '[0-9]+$')
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::$skipped edge test(s) skipped — the database-backed"\
                 "invariants did not run, and a skipped test reports green."
            exit 1
          fi

      - name: edge-server typecheck
        working-directory: private/edge-server
        run: npx tsc --noEmit

      - name: Install exam-terminal
        working-directory: private/exam-terminal
        run: npm ci

      - name: exam-terminal tests
        run: node --test --experimental-strip-types "private/exam-terminal/lib/*.test.ts"

  # ── Solidity ──────────────────────────────────────────────────────────────
  contracts:
    name: contracts (hardhat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: public/contracts/package-lock.json

      - name: Install
        working-directory: public/contracts
        run: npm ci

      - name: Hardhat test
        working-directory: public/contracts
        run: npx hardhat test

  # ── One status to require on the branch ───────────────────────────────────
  #
  # Branch protection can require this single check instead of five, and it
  # cannot be satisfied by a skipped or cancelled dependency: `needs` alone
  # would let this pass green when an upstream job never ran.
  ci:
    name: CI
    if: always()
    needs: [guards, backend, frontend, node-services, contracts]
    runs-on: ubuntu-latest
    steps:
      # String literals in a ${{ }} expression must be SINGLE-quoted. Writing
      # join(needs.*.result, " ") is not a runtime error in this step — it makes
      # the whole workflow file unparseable, so every job is skipped and the run
      # fails in 0s with no logs to read.
      - name: Verify every job succeeded
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
          echo "all jobs succeeded"

  # ── Gate Render on CI ───────────────────────────────────────────────────────
  #
  # Render's own auto-deploy fires on every push regardless of CI — a red commit
  # still ships. This job is the other half of gating it: it only runs after
  # `ci` (above) has actually passed, and only for a push (not a PR, which has
  # nothing merged yet) to the branch the two live services track.
  #
  # ⚠ THIS ALONE DOES NOT GATE ANYTHING. Render's own auto-deploy has to be
  # turned OFF in the dashboard for both services, or it deploys the red commit
  # itself before this job even finishes. Setup, once, in the Render dashboard:
  #   1. Each service → Settings → Build & Deploy → Auto-Deploy → No.
  #   2. Each service → Settings → Deploy Hook → Create → copy the URL.
  #   3. Repo → Settings → Secrets and variables → Actions → New repository
  #      secret: RENDER_DEPLOY_HOOK_BACKEND and RENDER_DEPLOY_HOOK_FRONTEND,
  #      pasting each service's hook URL.
  # Until both secrets exist this job no-ops (logs a notice, exits 0) rather
  # than failing the run — so merging this workflow file is itself harmless.
  #
  # The branch name below is deploy/allinone-image-and-setter-portal-specific:
  # it names whichever branch the two Render services are currently connected
  # to, which is this feature branch, not `main` (confirmed 2026-08-21 — the
  # live frontend serves `/faq` and other content that only exists here).
  # Update it if the services are ever repointed to `main`.
  deploy:
    name: deploy (Render, gated on CI)
    needs: [ci]
    if: >
      needs.ci.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feat/allinone-image-and-setter-portal'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_BACKEND not set — skipping (Render's own auto-deploy, if still on, is what's shipping this commit)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "backend deploy triggered"

      - name: Trigger frontend deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_FRONTEND not set — skipping (Render's own auto-deploy, if still on, is what's shipping this commit)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "frontend deploy triggered"
