## CryptoExam Core — Render Blueprint
## Usage: Render → New → Blueprint → select this repo.
## Render reads this file and creates:
##   cryptoexam-db        — managed Postgres 16
##   cryptoexam-backend   — FastAPI API (Docker, Dockerfile.render)
##   cryptoexam-frontend  — Next.js 16 (Docker, Dockerfile.render)
##
## IMPORTANT: After first deploy, confirm the frontend URL Render assigns
##   (usually https://cryptoexam-frontend.onrender.com) and update
##   CORS_ALLOW_ORIGINS on the backend if it differs.
##
## Login: admin@cryptoexam.dev / CryptoExam@2026!
## OTP:   DEBUG=true → the OTP is returned in the API response and shown in
##        the login UI automatically (no Twilio SMS gateway needed).

databases:
  - name: cryptoexam-db
    plan: free
    databaseName: cryptoexam
    user: ce

services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────
  - type: web
    name: cryptoexam-backend
    plan: free
    runtime: docker
    dockerfilePath: ./public/backend/Dockerfile.render
    dockerContext: ./public/backend
    envVars:
      # ── Database ──
      - key: DATABASE_URL
        fromDatabase:
          name: cryptoexam-db
          property: connectionString

