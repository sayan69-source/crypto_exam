      # ── Admin seed credentials ────────────────────────────────────────────
      - key: SEED_ADMIN_EMAIL
        value: admin@cryptoexam.dev
      - key: SEED_ADMIN_PASSWORD
        value: "CryptoExam@2026!"
      - key: SEED_ADMIN_PHONE
        value: "+919000000000"

      # ── App behaviour ─────────────────────────────────────────────────────
      - key: DEBUG
        value: "true"          # Shows dev OTP in API response — no Twilio needed
      - key: SEED_ON_START
        value: "true"          # Seeds the DB on first boot, no-ops afterwards

      # ── CORS (set to the frontend URL Render assigns) ─────────────────────
      - key: CORS_ALLOW_ORIGINS
        value: https://cryptoexam-frontend.onrender.com

      # ── Cryptography ──────────────────────────────────────────────────────
      - key: DRAND_CHAIN_HASH
        value: "8990e7a9aaed2ffed73dbd7092123d6f289930540d7651336225dc172e51b2ce"

      # ── Blockchain (Polygon Amoy testnet — public RPC, no key needed) ─────
      - key: POLYGON_RPC_URL
        value: https://rpc-amoy.polygon.technology
      - key: POLYGON_CHAIN_ID
        value: "80002"

  # ── Next.js Frontend ─────────────────────────────────────────────────────
  - type: web
    name: cryptoexam-frontend
    plan: free
    runtime: docker
    dockerfilePath: ./public/frontend/Dockerfile.render
    dockerContext: ./public/frontend
    dockerBuildArgs:
      # NEXT_PUBLIC_* are baked into the client bundle at build time.
      # Must point to the live backend URL before the frontend build starts.
      NEXT_PUBLIC_API_URL: https://cryptoexam-backend.onrender.com/api/v1
      NEXT_PUBLIC_USE_MOCK: "false"
    envVars:
      - key: NODE_ENV
        value: production
